# Julep build tasks. `mise run` lists them; `mise run all` is the full check.

[tools]
xcodegen = "2.46.0"
uv = "latest"

[env]
# The iOS simulator this project drives, pinned by UDID so a concurrent session
# working on another simulator is never disturbed. Override in mise.local.toml.
JULEP_SIMULATOR_UDID = "0BC1890E-7ADB-4094-850C-5799A477867D"  # iPhone 17 Pro, iOS 26.5

[tasks.generate]
description = "Regenerate Julep.xcodeproj from project.yml"
run = "xcodegen generate --quiet"

[tasks.icon]
description = "Regenerate Apps/Shared/Julep.icon from Tools/icon-source.{svg,png}"
run = "uv run --quiet {{config_root}}/Tools/build_icon.py"

[tasks.mac]
description = "Build the macOS app"
depends = ["generate"]
run = """
xcodebuild -project Julep.xcodeproj -scheme Julep-macOS \
    -destination 'platform=macOS' -configuration Debug -quiet \
    -allowProvisioningUpdates -allowProvisioningDeviceRegistration build
"""

[tasks.ios]
description = "Build the iOS app for the pinned simulator"
depends = ["generate"]
run = """
xcodebuild -project Julep.xcodeproj -scheme Julep-iOS \
    -destination "platform=iOS Simulator,id=$JULEP_SIMULATOR_UDID" \
    -configuration Debug -quiet build
"""

[tasks.test]
description = "Run the JulepKit package tests"
dir = "{{config_root}}/JulepKit"
run = "swift test"

[tasks.entitlements]
description = "Show what codesign actually granted the built macOS app"
depends = ["mac"]
run = """
app=$(xcodebuild -project Julep.xcodeproj -scheme Julep-macOS \
    -destination 'platform=macOS' -configuration Debug -showBuildSettings 2>/dev/null \
    | awk -F' = ' '/ BUILT_PRODUCTS_DIR/{d=$2} / FULL_PRODUCT_NAME/{n=$2} END{print d"/"n}')
codesign -d --entitlements - "$app" 2>&1 | grep -v '^Executable='
"""

[tasks.app]
description = "Build and launch the macOS app (uses the real iCloud container)"
depends = ["mac"]
run = """
app=$(xcodebuild -project Julep.xcodeproj -scheme Julep-macOS \
    -destination 'platform=macOS' -configuration Debug -showBuildSettings 2>/dev/null \
    | awk -F' = ' '/ BUILT_PRODUCTS_DIR/{d=$2} / FULL_PRODUCT_NAME/{n=$2} END{print d"/"n}')
pkill -x Julep 2>/dev/null || true
open "$app"
echo "launched $app"
"""

[tasks.app-ios]
description = "Build, install and launch on the pinned simulator, backed by a local file"
depends = ["ios"]
run = """
set -e
app=/Users/$USER/Library/Developer/Xcode/DerivedData
app=$(xcodebuild -project Julep.xcodeproj -scheme Julep-iOS \
    -destination "platform=iOS Simulator,id=$JULEP_SIMULATOR_UDID" \
    -configuration Debug -showBuildSettings 2>/dev/null \
    | awk -F' = ' '/ BUILT_PRODUCTS_DIR/{d=$2} / FULL_PRODUCT_NAME/{n=$2} END{print d"/"n}')

xcrun simctl boot "$JULEP_SIMULATOR_UDID" 2>/dev/null || true
xcrun simctl bootstatus "$JULEP_SIMULATOR_UDID" -b > /dev/null
open -a Simulator --args -CurrentDeviceUDID "$JULEP_SIMULATOR_UDID"
xcrun simctl terminate "$JULEP_SIMULATOR_UDID" com.quipsoteric.julep 2>/dev/null || true
xcrun simctl install "$JULEP_SIMULATOR_UDID" "$app"

# The simulator has no iCloud account, so back it with a plain directory that survives
# relaunches. Seed it from the corpus the first time so there is something to look at.
data=$(xcrun simctl get_app_container "$JULEP_SIMULATOR_UDID" com.quipsoteric.julep data)
journal="$data/Documents/journal"
mkdir -p "$journal"
[ -f "$journal/journal.txt" ] || cp JulepKit/Tests/JulepKitTests/Resources/corpus.txt "$journal/journal.txt"

xcrun simctl launch "$JULEP_SIMULATOR_UDID" com.quipsoteric.julep --local-container "$journal"
echo "journal: $journal/journal.txt"
"""

[tasks.doctor]
description = "Ask the signed macOS app whether its iCloud container actually resolves"
depends = ["mac"]
run = """
app=$(xcodebuild -project Julep.xcodeproj -scheme Julep-macOS \
    -destination 'platform=macOS' -configuration Debug -showBuildSettings 2>/dev/null \
    | awk -F' = ' '/ BUILT_PRODUCTS_DIR/{d=$2} / FULL_PRODUCT_NAME/{n=$2} END{print d"/"n}')
"$app/Contents/MacOS/Julep" --container-check
"""

[tasks.uitest]
description = "Run the iOS UI tests on the pinned simulator"
depends = ["generate"]
run = """
xcodebuild -project Julep.xcodeproj -scheme Julep-iOS \
    -destination "platform=iOS Simulator,id=$JULEP_SIMULATOR_UDID" \
    -configuration Debug test 2>&1 | grep -E "Test Case|Test Suite 'All tests'|error:|\\*\\* TEST"
"""

[tasks.uitest-mac]
description = "Run the macOS UI tests"
depends = ["generate"]
run = """
xcodebuild -project Julep.xcodeproj -scheme Julep-macOS \
    -destination 'platform=macOS' -configuration Debug \
    -allowProvisioningUpdates -allowProvisioningDeviceRegistration test 2>&1 \
  | grep -E "Test Case|error:|Testing failed|encountered an error|\\*\\* TEST"
"""

[tasks.schedule]
description = "Print the schedule store and what the app derives from it"
depends = ["mac"]
run = """
app=$(xcodebuild -project Julep.xcodeproj -scheme Julep-macOS \
    -destination 'platform=macOS' -configuration Debug -showBuildSettings 2>/dev/null \
    | awk -F' = ' '/ BUILT_PRODUCTS_DIR/{d=$2} / FULL_PRODUCT_NAME/{n=$2} END{print d"/"n}')
"$app/Contents/MacOS/Julep" --schedule-check
"""

[tasks.sparkle-tools]
description = "Download Sparkle's signing tools into .sparkle/ (gitignored)"
run = """
set -euo pipefail
version=2.9.6
dir="{{config_root}}/.sparkle"
if [ -x "$dir/bin/generate_keys" ]; then
    echo "already present: $dir/bin"
    exit 0
fi
mkdir -p "$dir"
curl -fsSL -o "$dir/sparkle.tar.xz" \
    "https://github.com/sparkle-project/Sparkle/releases/download/$version/Sparkle-$version.tar.xz"
tar -xf "$dir/sparkle.tar.xz" -C "$dir"
echo "tools in $dir/bin"
"""

[tasks.archive-mac]
description = "Archive, notarize and export a stapled Julep.app into build/release"
depends = ["generate"]
run = """
set -euo pipefail
out="{{config_root}}/build/release"
archive="$out/Julep.xcarchive"
rm -rf "$out"
mkdir -p "$out"

xcodebuild archive \
    -project Julep.xcodeproj -scheme Julep-macOS \
    -destination 'platform=macOS' -configuration Release \
    -archivePath "$archive" \
    -allowProvisioningUpdates -quiet

# `destination: upload` hands the archive to Apple's notary service using the account
# already signed in to Xcode. That is the whole reason this route exists: notarytool
# would want its own stored credential, and this wants nothing.
cat > "$out/ExportOptions.plist" <<'PLIST'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>method</key><string>developer-id</string>
    <key>destination</key><string>upload</string>
    <key>teamID</key><string>D2JFF2VC6K</string>
    <key>signingStyle</key><string>automatic</string>
</dict>
</plist>
PLIST

xcodebuild -exportArchive \
    -archivePath "$archive" \
    -exportOptionsPlist "$out/ExportOptions.plist" \
    -allowProvisioningUpdates

# Notarization is asynchronous: the upload above returns long before Apple is done.
# `-exportNotarizedApp` is what fetches the stapled build, and it simply fails until
# the ticket exists -- so it is retried rather than waited on.
echo "waiting on notarization..."
for _ in $(seq 1 40); do
    if xcodebuild -exportNotarizedApp -archivePath "$archive" -exportPath "$out" 2>/dev/null; then
        echo
        echo "stapled app: $out/Julep.app"
        echo "next: mise run publish-mac -- $out/Julep.app"
        exit 0
    fi
    sleep 30
done
echo "not notarized after 20 minutes -- check Xcode's Organizer for the rejection" >&2
exit 1
"""

[tasks.publish-mac]
description = "Zip a notarized Julep.app and cut the release the appcast workflow signs"
run = """
set -euo pipefail
app="${1:-}"
if [ -z "$app" ]; then
    echo "usage: mise run publish-mac -- /path/to/exported/Julep.app" >&2
    exit 2
fi
[ -d "$app" ] || { echo "no such app: $app" >&2; exit 2; }

# Everything below is checked *before* anything is published, because an unsigned or
# un-notarized build is not a broken release -- it is a release that installs fine on
# the machine that built it and is refused by every other one.
codesign --verify --strict --deep "$app"
spctl --assess --type exec -vv "$app"
xcrun stapler validate "$app"

version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
zip="Julep-$version.zip"

# ditto, not zip: an .app is full of symlinks and a framework bundle, and only this
# preserves them well enough that the copy still launches.
rm -f "$zip"
ditto -c -k --keepParent "$app" "$zip"

gh release create "v$version" "$zip" \
    --title "Julep $version" \
    --notes "Julep $version"

echo "published v$version -- the appcast workflow signs the feed from here"
"""

[tasks.all]
description = "Build both apps and run tests"
run = ["mise run mac", "mise run ios", "mise run test", "mise run uitest", "mise run uitest-mac"]
