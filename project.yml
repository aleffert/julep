name: Julep

options:
  bundleIdPrefix: com.quipsoteric
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"

settings:
  base:
    DEVELOPMENT_TEAM: D2JFF2VC6K
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"

packages:
  JulepKit:
    path: JulepKit
  # macOS only. iOS updates come from the App Store, and Sparkle has no business there.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.6

targets:
  Julep-macOS:
    type: application
    platform: macOS
    sources:
      - Apps/macOS/Sources
      - Apps/macOS/Resources
      - path: Apps/Shared
        excludes:
          - "Julep.icon/**"
      # An Icon Composer .icon is a package, not a folder of loose files. `type: file`
      # stops XcodeGen descending into it and adding icon.json and Assets separately.
      - path: Apps/Shared/Julep.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: JulepKit
      - package: Sparkle
    # XcodeGen *generates* this file from `properties` on every run -- it does not
    # reference a hand-written one. The keys have to live here or they get blanked.
    entitlements:
      path: Apps/macOS/Supporting/Julep-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        # Sparkle fetches the appcast and the update itself. This is the app's only
        # network access -- nothing else here talks to anything.
        com.apple.security.network.client: true
        # How the sandboxed app reaches Sparkle's Installer XPC service, which does the
        # install from outside the sandbox. Sparkle derives both names from the bundle
        # id; they are written out literally rather than as $(PRODUCT_BUNDLE_IDENTIFIER)
        # because an unexpanded build setting here fails silently at runtime.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - com.quipsoteric.julep-spks
          - com.quipsoteric.julep-spki
        com.apple.developer.icloud-services: [CloudDocuments]
        com.apple.developer.icloud-container-identifiers:
          [iCloud.com.quipsoteric.julep]
        com.apple.developer.ubiquity-container-identifiers:
          [iCloud.com.quipsoteric.julep]
    info:
      path: Apps/macOS/Supporting/Info.plist
      properties:
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: ""
        # Served by GitHub Pages out of /docs, and rewritten by the appcast workflow on
        # every published release.
        SUFeedURL: https://aleffert.github.io/julep/appcast.xml
        # The public half of the ed25519 pair whose private half signs the appcast.
        # Matching the two is what makes an update trustworthy, so this half travels in
        # the app and the private half never leaves the Keychain and the repo secret.
        # `.sparkle/bin/generate_keys -p` prints it again if it is ever in doubt.
        SUPublicEDKey: "CZ/o2+skLldCHmFCAcsTm/YaJOM7a6IFxa5WPFLr/so="
        # Mandatory under the sandbox: the service that installs outside it. It ships
        # inside Sparkle.framework, so there is nothing to copy in by hand.
        SUEnableInstallerLauncherService: true
        # Checks in the background without asking on first launch. This is a personal
        # app on the author's own machines, so the permission prompt is only friction.
        SUEnableAutomaticChecks: true
        # Exposes the journal in Finder's iCloud Drive, so the file stays openable
        # by any text editor -- the whole point of iCloud files over CloudKit.
        NSUbiquitousContainers:
          iCloud.com.quipsoteric.julep:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Julep
            NSUbiquitousContainerSupportedFolderLevels: Any
    settings:
      base:
        PRODUCT_NAME: Julep
        PRODUCT_BUNDLE_IDENTIFIER: com.quipsoteric.julep
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: Julep

  Julep-iOS:
    type: application
    platform: iOS
    sources:
      - Apps/iOS/Sources
      - Apps/iOS/Resources
      - path: Apps/Shared
        excludes:
          - "Julep.icon/**"
      - path: Apps/Shared/Julep.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: JulepKit
    entitlements:
      path: Apps/iOS/Supporting/Julep-iOS.entitlements
      properties:
        com.apple.developer.icloud-services: [CloudDocuments]
        com.apple.developer.icloud-container-identifiers:
          [iCloud.com.quipsoteric.julep]
        com.apple.developer.ubiquity-container-identifiers:
          [iCloud.com.quipsoteric.julep]
    info:
      path: Apps/iOS/Supporting/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Same container, exposed to the Files app.
        NSUbiquitousContainers:
          iCloud.com.quipsoteric.julep:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Julep
            NSUbiquitousContainerSupportedFolderLevels: Any
    settings:
      base:
        PRODUCT_NAME: Julep
        PRODUCT_BUNDLE_IDENTIFIER: com.quipsoteric.julep
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: Julep

  Julep-macOSUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Apps/macOS/UITests
    dependencies:
      - target: Julep-macOS
    # The runner must be unsandboxed. Sandboxed, its home is redirected into its own
    # container, so a journal it seeds lands somewhere the app is allowed to read but not
    # write -- which reads as "the app does not save" and is nothing of the sort.
    entitlements:
      path: Apps/macOS/UITests/Julep-macOSUITests.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quipsoteric.julep.macuitests
        TEST_TARGET_NAME: Julep-macOS
        GENERATE_INFOPLIST_FILE: YES

  Julep-iOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Apps/iOS/UITests
    dependencies:
      - target: Julep-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quipsoteric.julep.uitests
        TEST_TARGET_NAME: Julep-iOS
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Julep-macOS:
    build:
      targets:
        Julep-macOS: all
        Julep-macOSUITests: [test]
    test:
      config: Debug
      targets:
        - Julep-macOSUITests
    run:
      config: Debug
  Julep-iOS:
    build:
      targets:
        Julep-iOS: all
        Julep-iOSUITests: [test]
    test:
      config: Debug
      targets:
        - Julep-iOSUITests
    run:
      config: Debug
