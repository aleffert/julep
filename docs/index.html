<h1>Julep</h1>
<p>A journal that is a plain text file and nothing else. Items are <code>- </code>,
tags are <code>[name]</code>, deferrals are <code>@schedule(...)</code>, and every one
of them survives being opened in any editor.</p>
<p><a href="https://github.com/aleffert/julep/releases/latest">Download the latest release</a></p>
<p>Installed copies update themselves through
<a href="appcast.xml">this appcast</a>.</p>
